# 현관 자동화 (2026-10-16). HA에는 설정 > 자동화에 같은 내용으로 등록됨.
# 외출/귀가 구분: sensor.hyeongwan_doeorag_last_unlock 이
#   "실내에서 도어락을 열었습니다" → 나가는 중, 지문/얼굴인식/비밀번호 등 → 들어오는 중.

- id: entrance_arrival_kitchen_light
  alias: 귀가 시 주방 조명 켜기 (빈집 + 해진 뒤)
  description: >-
    아무도 없던 집에 해가 진 뒤 밖에서 문을 열고 들어오면 주방 조명 왼쪽·가운데를 켠다.
    폰 Wi-Fi가 문 열기 직전에 먼저 붙는 경우를 위해, 3분 안에 재실로 바뀐 사람은 '없던 것'으로 본다.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.hyeongwan_doeorag_door
      to: "on"
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: template
      value_template: >-
        {% set ns = namespace(ok=true) %}
        {% for e in ['binary_sensor.na_wi_fi_jaesil', 'binary_sensor.waipeu_wi_fi_jaesil'] %}
          {% if is_state(e, 'on') and (now() - states[e].last_changed).total_seconds() > 180 %}
            {% set ns.ok = false %}
          {% endif %}
        {% endfor %}
        {{ ns.ok }}
  actions:
    - delay: "00:00:02"   # 문 센서와 '마지막 열림' 문구가 같은 초에 바뀌므로 문구 갱신을 기다린다
    - condition: template
      value_template: >-
        {{ 'unavailable' not in states('sensor.hyeongwan_doeorag_last_unlock')
           and '실내' not in states('sensor.hyeongwan_doeorag_last_unlock') }}
    - action: switch.turn_on
      target:
        entity_id:
          - switch.jubang_jomyeong_left
          - switch.jubang_jomyeong_center

- id: entrance_leave_elevator_call
  alias: 출근길 엘리베이터 자동 호출 (평일 07:30~09:00)
  description: >-
    평일 07:30~09:00에 집에 사람이 있는 상태에서 실내에서 문을 열고 나가면 엘리베이터를 호출한다.
    RS485 호출 패킷 A0 01 01 00 08 15 00 BF (2026-10-15 실측). 연속 호출 방지로 2분간 재실행 안 함.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.hyeongwan_doeorag_door
      to: "on"
  conditions:
    - condition: time
      after: "07:30:00"
      before: "09:00:00"
      weekday: [mon, tue, wed, thu, fri]
    - condition: template
      value_template: "{{ states('sensor.household_presence') not in ['아무도 없음', 'unknown', 'unavailable'] }}"
  actions:
    - delay: "00:00:02"
    - condition: template
      value_template: "{{ '실내' in states('sensor.hyeongwan_doeorag_last_unlock') }}"
    - action: button.press
      target:
        entity_id: button.commax_ev1
    - delay: "00:02:00"
